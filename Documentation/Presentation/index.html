<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Intelligence Layer (DIL) — Technical and Business Architecture</title>
  
  <!-- React 18 & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            corporate: {
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
              400: '#94A3B8',
              500: '#64748B',
              600: '#475569',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A',
            },
            accent: {
              blue: '#2563EB',
              teal: '#0D9488',
              emerald: '#059669',
              amber: '#D97706',
              rose: '#E11D48',
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      overflow-x: hidden;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    .card-clean {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="bg-corporate-50 text-corporate-900 min-h-screen selection:bg-corporate-200 selection:text-corporate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SLIDES = [
      { id: 1, title: "Executive Overview", category: "Strategy" },
      { id: 2, title: "The Enterprise LLM Problem", category: "Market Need" },
      { id: 3, title: "What is DIL & Strategic Value", category: "Solution" },
      { id: 4, title: "Technical Architecture Pipeline", category: "Engineering" },
      { id: 5, title: "DIL Library & PyPI Release", category: "SDK & Integration" },
      { id: 6, title: "The 51-Function Catalog", category: "API Reference" },
      { id: 7, title: "How DIL Was Engineered", category: "Methodology" },
      { id: 8, title: "Data-to-DIL Transformation", category: "Data Engineering" },
      { id: 9, title: "Case Study: Single Regulation", category: "Deep Dive" },
      { id: 10, title: "Enterprise Database Pipeline", category: "Implementation" },
      { id: 11, title: "Commercial Banking Use Cases", category: "Applications" },
      { id: 12, title: "Production Verification Gate", category: "Quality Assurance" }
    ];

    function App() {
      const [currentSlide, setCurrentSlide] = useState(1);
      const [copied, setCopied] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [isMobile, setIsMobile] = useState(false);

      // Responsive screen size detection
      useEffect(() => {
        const handleResize = () => {
          const mobile = window.innerWidth < 1024;
          setIsMobile(mobile);
          if (mobile) {
            setSidebarOpen(false); // default closed on mobile/tablet
          } else {
            setSidebarOpen(true);  // default open on desktop
          }
        };
        handleResize();
        window.addEventListener("resize", handleResize);
        return () => window.removeEventListener("resize", handleResize);
      }, []);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
            setCurrentSlide((prev) => Math.min(prev + 1, SLIDES.length));
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            setCurrentSlide((prev) => Math.max(prev - 1, 1));
          } else if (e.key === "Home") {
            setCurrentSlide(1);
          } else if (e.key === "End") {
            setCurrentSlide(SLIDES.length);
          } else if (e.key === "Escape") {
            setShowReportModal(false);
            if (isMobile) setSidebarOpen(false);
          } else if (e.key === "i" || e.key === "I" || e.key === "m" || e.key === "M") {
            setSidebarOpen((prev) => !prev);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [isMobile]);

      const copyCode = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const selectSlide = (slideId) => {
        setCurrentSlide(slideId);
        if (isMobile) {
          setSidebarOpen(false); // auto close sidebar on mobile tap
        }
      };

      return (
        <div className="h-screen flex flex-col justify-between overflow-hidden">
          {/* Top Fixed Header */}
          <header className="bg-white border-b border-corporate-200 px-4 sm:px-6 py-3 flex items-center justify-between z-30 shrink-0">
            <div className="flex items-center gap-3">
              {/* Expand / Collapse Sidebar Button */}
              <button
                onClick={() => setSidebarOpen((prev) => !prev)}
                className="px-2.5 py-1.5 rounded-md border border-corporate-200 bg-corporate-50 hover:bg-corporate-100 text-corporate-700 text-xs font-mono font-medium flex items-center gap-1.5 transition-colors cursor-pointer shadow-xs"
                title="Toggle Slide Index Sidebar (Shortcut: I)"
              >
                <span className="font-bold">{sidebarOpen ? "«" : "»"}</span>
                <span className="hidden sm:inline">{sidebarOpen ? "Hide Index" : "Slide Index"}</span>
              </button>

              <div className="h-4 w-[1px] bg-corporate-200 hidden sm:block"></div>

              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded bg-corporate-900 text-white flex items-center justify-center font-bold text-xs tracking-wider">
                  DIL
                </div>
                <div>
                  <h1 className="text-sm font-bold text-corporate-900 leading-tight flex items-center gap-1.5">
                    Domain Intelligence Layer
                    <span className="text-[10px] px-1.5 py-0.2 rounded bg-corporate-100 text-corporate-600 font-mono border border-corporate-200">
                      v1.0.0
                    </span>
                  </h1>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="text-xs text-corporate-500 hidden md:block">
                <span className="text-corporate-400">Section:</span> <strong className="text-corporate-800">{SLIDES[currentSlide - 1].category}</strong>
                <span className="mx-2 text-corporate-300">|</span>
                Slide <span className="font-bold text-corporate-900 font-mono">{currentSlide}</span> / {SLIDES.length}
              </div>

              {/* Prev / Next Header Stepper */}
              <div className="flex items-center bg-corporate-50 border border-corporate-200 rounded p-0.5">
                <button 
                  onClick={() => setCurrentSlide((prev) => Math.max(prev - 1, 1))}
                  disabled={currentSlide === 1}
                  className="px-2.5 py-1 text-xs rounded hover:bg-white disabled:opacity-30 text-corporate-700 font-medium transition-colors cursor-pointer"
                >
                  Previous
                </button>
                <div className="h-3 w-[1px] bg-corporate-200 mx-0.5"></div>
                <button 
                  onClick={() => setCurrentSlide((prev) => Math.min(prev + 1, SLIDES.length))}
                  disabled={currentSlide === SLIDES.length}
                  className="px-2.5 py-1 text-xs rounded hover:bg-white disabled:opacity-30 text-corporate-700 font-medium transition-colors cursor-pointer"
                >
                  Next
                </button>
              </div>
            </div>
          </header>

          {/* Thin Global Progress Line */}
          <div className="w-full bg-corporate-100 h-1 shrink-0 overflow-hidden">
            <div 
              className="bg-corporate-900 h-full transition-all duration-300 ease-out"
              style={{ width: `${(currentSlide / SLIDES.length) * 100}%` }}
            ></div>
          </div>

          {/* Central Workspace (Sidebar + Main Slide Canvas) */}
          <div className="flex-1 flex overflow-hidden relative">
            {/* Mobile Backdrop Overlay */}
            {isMobile && sidebarOpen && (
              <div 
                onClick={() => setSidebarOpen(false)}
                className="fixed inset-0 bg-corporate-900/30 backdrop-blur-xs z-40 transition-opacity"
              ></div>
            )}

            {/* Collapsible Slide Index Sidebar */}
            <aside 
              className={`
                ${isMobile 
                  ? "fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transition-transform duration-300 ease-in-out transform" 
                  : "bg-white border-r border-corporate-200 transition-all duration-300 ease-in-out flex flex-col shrink-0"
                }
                ${isMobile 
                  ? (sidebarOpen ? "translate-x-0" : "-translate-x-full") 
                  : (sidebarOpen ? "w-64 xl:w-72" : "w-0 overflow-hidden border-r-0")
                }
              `}
            >
              <div className="p-3.5 border-b border-corporate-200 flex items-center justify-between bg-corporate-50/50">
                <span className="text-[11px] font-mono font-bold text-corporate-500 uppercase tracking-wider">
                  Slide Index ({SLIDES.length})
                </span>
                <button 
                  onClick={() => setSidebarOpen(false)}
                  className="text-corporate-400 hover:text-corporate-700 text-xs px-1.5 py-0.5 rounded hover:bg-corporate-100 cursor-pointer"
                  title="Collapse Sidebar"
                >
                  {isMobile ? "✕ Close" : "« Collapse"}
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                {SLIDES.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => selectSlide(s.id)}
                    className={`w-full p-2.5 rounded text-left transition-all flex items-start gap-2.5 cursor-pointer ${
                      currentSlide === s.id
                        ? "bg-corporate-900 text-white font-medium shadow-xs"
                        : "hover:bg-corporate-100 text-corporate-700"
                    }`}
                  >
                    <span className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded shrink-0 ${
                      currentSlide === s.id
                        ? "bg-corporate-800 text-white"
                        : "bg-corporate-100 text-corporate-600"
                    }`}>
                      {s.id < 10 ? `0${s.id}` : s.id}
                    </span>
                    <div className="min-w-0 flex-1">
                      <div className="text-xs truncate font-medium">{s.title}</div>
                      <div className={`text-[10px] font-mono truncate ${
                        currentSlide === s.id ? "text-corporate-300" : "text-corporate-400"
                      }`}>
                        {s.category}
                      </div>
                    </div>
                  </button>
                ))}
              </div>

              <div className="p-3 border-t border-corporate-200 bg-corporate-50 text-[11px] font-mono text-corporate-500 text-center">
                Press <kbd className="px-1 py-0.5 rounded bg-white border border-corporate-200 text-corporate-700">I</kbd> to toggle index
              </div>
            </aside>

            {/* Dynamic Main Slide Canvas */}
            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10 custom-scrollbar flex flex-col justify-center items-center">
              <div className="w-full max-w-5xl my-auto">
                {currentSlide === 1 && <Slide1 />}
                {currentSlide === 2 && <Slide2 />}
                {currentSlide === 3 && <Slide3 />}
                {currentSlide === 4 && <Slide4 />}
                {currentSlide === 5 && <Slide5 copyCode={copyCode} copied={copied} />}
                {currentSlide === 6 && <Slide6 />}
                {currentSlide === 7 && <Slide7 />}
                {currentSlide === 8 && <Slide8 copyCode={copyCode} copied={copied} />}
                {currentSlide === 9 && <Slide9 />}
                {currentSlide === 10 && <Slide10 />}
                {currentSlide === 11 && <Slide11 />}
                {currentSlide === 12 && <Slide12 />}
              </div>
            </main>
          </div>

          {/* Clean Redesigned Footer */}
          <footer className="bg-white border-t border-corporate-200 px-4 sm:px-6 py-2.5 flex flex-col sm:flex-row items-center justify-between gap-2.5 z-30 shrink-0 text-xs text-corporate-600">
            {/* Left Status Badge */}
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-accent-emerald"></span>
              <span className="font-semibold text-corporate-800">Domain Intelligence Layer</span>
              <span className="text-corporate-300">|</span>
              <span className="text-corporate-500 font-mono text-[11px]">Banking Pack v1.0.0</span>
            </div>

            {/* Right Smooth Interactive Buttons */}
            <div className="flex items-center gap-3">
              {/* Smooth Keyboard Navigation Pill */}
              <div className="flex items-center gap-2 bg-corporate-50 px-2.5 py-1 rounded-full border border-corporate-200 shadow-xs">
                <span className="text-[11px] font-medium text-corporate-500">Navigate:</span>
                <div className="flex items-center gap-1">
                  <button 
                    onClick={() => setCurrentSlide((prev) => Math.max(prev - 1, 1))}
                    disabled={currentSlide === 1}
                    className="w-5 h-5 flex items-center justify-center rounded border border-corporate-200 bg-white text-[11px] font-mono font-bold text-corporate-700 hover:bg-corporate-100 disabled:opacity-30 transition-colors shadow-xs cursor-pointer"
                    title="Previous Slide (Left Arrow)"
                  >
                    ←
                  </button>
                  <button 
                    onClick={() => setCurrentSlide((prev) => Math.min(prev + 1, SLIDES.length))}
                    disabled={currentSlide === SLIDES.length}
                    className="w-5 h-5 flex items-center justify-center rounded border border-corporate-200 bg-white text-[11px] font-mono font-bold text-corporate-700 hover:bg-corporate-100 disabled:opacity-30 transition-colors shadow-xs cursor-pointer"
                    title="Next Slide (Right Arrow or Space)"
                  >
                    →
                  </button>
                </div>
                <span className="text-[10px] text-corporate-400 font-mono">Keys</span>
              </div>

              {/* Smooth Technical Report Action Button */}
              <button 
                onClick={() => setShowReportModal(true)}
                className="group flex items-center gap-2 bg-corporate-50 hover:bg-corporate-900 text-corporate-800 hover:text-white px-3 py-1 rounded-full border border-corporate-200 hover:border-corporate-900 transition-all duration-200 shadow-xs text-xs font-medium cursor-pointer"
              >
                <span className="w-1.5 h-1.5 rounded-full bg-accent-blue group-hover:bg-blue-400 transition-colors"></span>
                <span>DIL Technical Report</span>
                <span className="text-[10px] font-mono text-corporate-400 group-hover:text-corporate-300">v1.0.0</span>
              </button>
            </div>
          </footer>

          {/* Executive Technical Report Modal Dialog */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-corporate-900/40 backdrop-blur-xs p-4">
              <div className="bg-white rounded-xl border border-corporate-200 shadow-2xl max-w-xl w-full p-6 space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between pb-3 border-b border-corporate-100">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-accent-emerald"></span>
                    <h3 className="font-bold text-base text-corporate-900">DIL Technical Report & Architecture</h3>
                  </div>
                  <button 
                    onClick={() => setShowReportModal(false)}
                    className="w-7 h-7 rounded flex items-center justify-center text-corporate-400 hover:bg-corporate-100 hover:text-corporate-700 text-xs font-bold cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs text-corporate-600">
                  <p>
                    The <strong>Domain Intelligence Layer (DIL)</strong> decouples domain knowledge, regulatory compliance, and deterministic calculations from general-purpose language models.
                  </p>

                  <div className="grid grid-cols-2 gap-2 font-mono text-[11px] p-3 rounded bg-corporate-50 border border-corporate-200 text-corporate-800">
                    <div>Specification: PEP 517 / v1.0.0</div>
                    <div>Mean Latency: 3.3 ms</div>
                    <div>Golden Benchmark: 110/110 passed</div>
                    <div>Statutory Rules: 24 active</div>
                    <div>Storage Engine: SQLite FTS5 + Parquet</div>
                    <div>LLM Support: Model-Agnostic</div>
                  </div>

                  <div className="space-y-1 pt-1">
                    <strong className="text-corporate-900 block">Available Documentation Assets:</strong>
                    <ul className="space-y-1 text-corporate-600 pl-4 list-disc">
                      <li>Domain Intelligence Layer Concept, Architecture, Build Plan and Go-to-Market (51-page Master Paper)</li>
                      <li>DIL Banking Production Implementation Plan (8-Month Enterprise Roadmap)</li>
                      <li>Gate 2 Quality & Regression Benchmark Suite (100% Pass Rate)</li>
                    </ul>
                  </div>
                </div>

                <div className="pt-2 flex items-center justify-end gap-2 border-t border-corporate-100">
                  <button 
                    onClick={() => setShowReportModal(false)}
                    className="px-4 py-1.5 rounded bg-corporate-900 text-white text-xs font-semibold hover:bg-corporate-800 transition-colors cursor-pointer"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // SLIDE 1: Executive Overview
    // =========================================================================
    function Slide1() {
      return (
        <div className="space-y-6 sm:space-y-8 animate-fadeIn">
          <div className="space-y-2.5">
            <div className="inline-block px-2.5 py-1 rounded bg-corporate-100 border border-corporate-200 text-corporate-700 text-xs font-semibold uppercase tracking-wider font-mono">
              Strategic Executive Briefing
            </div>
            <h2 className="text-3xl sm:text-5xl font-extrabold text-corporate-900 tracking-tight leading-tight">
              Domain Intelligence Layer (DIL)
            </h2>
            <p className="text-base sm:text-lg text-corporate-600 font-normal leading-relaxed max-w-3xl">
              Decoupling domain knowledge, regulatory compliance, and deterministic arithmetic from probabilistic Large Language Models in enterprise financial systems.
            </p>
          </div>

          <div className="p-5 sm:p-6 rounded-lg bg-corporate-900 text-white shadow-sm space-y-2">
            <div className="text-[11px] uppercase tracking-widest text-corporate-300 font-mono font-semibold">
              The Architecture Thesis
            </div>
            <p className="text-xl sm:text-2xl font-bold tracking-tight">
              "Code calculates and decides; LLMs explain."
            </p>
            <p className="text-xs text-corporate-300 leading-relaxed max-w-3xl">
              LLMs excel at natural language articulation, translation, and user interaction, but fail catastrophically at arithmetic precision and statutory compliance. DIL enforces deterministic calculations and legal thresholds in code before any prompt reaches the language model.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="card-clean p-4 sm:p-5 rounded-lg space-y-1">
              <div className="text-xs uppercase font-mono text-corporate-400">Execution Speed</div>
              <div className="text-xl sm:text-2xl font-bold text-corporate-900">&lt; 4 ms Latency</div>
              <p className="text-xs text-corporate-500">Instant regex extraction and constant-time statutory rule evaluation in pure Python.</p>
            </div>
            <div className="card-clean p-4 sm:p-5 rounded-lg space-y-1">
              <div className="text-xs uppercase font-mono text-corporate-400">Accuracy & Compliance</div>
              <div className="text-xl sm:text-2xl font-bold text-corporate-900">100% Deterministic</div>
              <p className="text-xs text-corporate-500">110/110 golden benchmark scenarios passing across mathematical and policy tests.</p>
            </div>
            <div className="card-clean p-4 sm:p-5 rounded-lg space-y-1">
              <div className="text-xs uppercase font-mono text-corporate-400">Platform Portability</div>
              <div className="text-xl sm:text-2xl font-bold text-corporate-900">Model Agnostic</div>
              <p className="text-xs text-corporate-500">Compatible with OpenAI, Google Gemini, Anthropic, or private on-premise Ollama LLaMA models.</p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SLIDE 2: The Enterprise LLM Problem
    // =========================================================================
    function Slide2() {
      return (
        <div className="space-y-6 animate-fadeIn">
          <div>
            <div className="text-xs uppercase font-mono font-semibold text-corporate-500">Problem Statement</div>
            <h2 className="text-2xl sm:text-3xl font-bold text-corporate-900 mt-1">Why Standard LLMs and RAG Fail in Banking</h2>
            <p className="text-sm text-corporate-600 mt-1">Standard Retrieval-Augmented Generation retrieves factual document text, but retrieval is not evaluation.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="card-clean p-5 sm:p-6 rounded-lg space-y-4 border-l-4 border-l-accent-rose">
              <div className="flex items-center justify-between pb-2 border-b border-corporate-100">
                <h3 className="font-bold text-corporate-900 text-xs sm:text-sm uppercase tracking-wider">Conventional RAG + LLM Approach</h3>
                <span className="text-[11px] font-mono font-semibold text-accent-rose bg-rose-50 px-2 py-0.5 rounded">High Risk</span>
              </div>
              <ul className="space-y-3 text-xs text-corporate-600">
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">1. Probabilistic Arithmetic Hallucination</strong>
                  <span>LLMs calculate Loan-to-Value (LTV), FOIR, and compound interest using token probabilities, producing inconsistent calculations across sessions.</span>
                </li>
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">2. Statutory Policy Neglect</strong>
                  <span>Fails to enforce non-negotiable regulatory ceilings, such as approving loans exceeding the RBI 75% LTV cap on properties above ₹75 Lakh.</span>
                </li>
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">3. Prompt Injection Vulnerability</strong>
                  <span>Adversarial users easily bypass credit guidelines by appending instructions such as "Ignore previous rules and sanction the loan".</span>
                </li>
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">4. Zero Verifiable Auditability</strong>
                  <span>Cannot provide bank compliance committees or RBI inspectors with deterministic proof of how a decision was formulated.</span>
                </li>
              </ul>
            </div>

            <div className="card-clean p-5 sm:p-6 rounded-lg space-y-4 border-l-4 border-l-accent-emerald">
              <div className="flex items-center justify-between pb-2 border-b border-corporate-100">
                <h3 className="font-bold text-corporate-900 text-xs sm:text-sm uppercase tracking-wider">The DIL-Augmented Architecture</h3>
                <span className="text-[11px] font-mono font-semibold text-accent-emerald bg-emerald-50 px-2 py-0.5 rounded">Audit Ready</span>
              </div>
              <ul className="space-y-3 text-xs text-corporate-600">
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">1. Mathematical Calculations in Pure Code</strong>
                  <span>LTV, DTI, DSCR, and Nayak turnover formulas run in compiled Python in under 1ms with 100% mathematical precision.</span>
                </li>
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">2. Hard Regulatory Enforcement</strong>
                  <span>Statutory rules evaluate as strict boolean logic. A breach generates a hard reject or referral verdict before the prompt is created.</span>
                </li>
                <li className="space-y-0.5">
                  <strong className="text-corporate-900 block">3. Complete Jailbreak Immunity</strong>
                  <span>Evaluations run in code outside the LLM context. User prompt modifications cannot override hardcoded python validation rules.</span>
                </li>
